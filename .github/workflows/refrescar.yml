name: Refrescar el Sistema

# Regenera el perfil con los datos reales de tus repos: nivel, misiones, extracciones.
# Un push a este repo no dispara otra corrida (los pushes con GITHUB_TOKEN no activan workflows).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'fonts/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: refrescar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Generar SVG, README y la Sala
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar cambios (solo si hay)
        run: |
          git config user.name "el-sistema[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: el Sistema se actualiza ($(date -u +%F))"
            git push
          fi
